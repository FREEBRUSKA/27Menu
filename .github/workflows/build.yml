name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -e
          curl -fL --retry 3 -o tc.tar.gz https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
          mkdir -p "$HOME/tc"
          tar xzf tc.tar.gz -C "$HOME/tc"
          CF=$(find "$HOME/tc" -name 'create-fself' | head -1)
          test -n "$CF"
          TC=$(dirname "$(dirname "$(dirname "$CF")")")
          echo "TC=$TC"
          ls "$TC"
          ls "$TC/bin" || true
          ls "$TC/bin/linux" || true
          CC=$(find "$TC" -name 'clang++' | head -1)
          LD=$(find "$TC" -name 'ld.lld' | head -1)
          LM=$(find "$TC" -name 'linker.map' | head -1)
          LIBD=$(dirname "$(find "$TC" -name 'libSceLibKernel_stub.a' | head -1)")
          INC=$(dirname "$(dirname "$(find "$TC" -name 'libkernel.h' | head -1)")")
          echo "CC=$CC"
          echo "LD=$LD"
          echo "LM=$LM"
          echo "LIBD=$LIBD"
          echo "INC=$INC"
          test -n "$CC"
          test -n "$LD"
          test -n "$LM"
          test -d "$LIBD"
          test -d "$INC"
          {
            echo "TC=$TC"
            echo "CF=$CF"
            echo "CC=$CC"
            echo "LD=$LD"
            echo "LM=$LM"
            echo "LIBD=$LIBD"
            echo "INC=$INC"
          } >> $GITHUB_ENV

      - name: Build
        run: |
          set -e
          mkdir -p out
          "$CC" -target x86_64-pc-freebsd12-elf -fPIC -funwind-tables -isysroot "$TC" -isystem "$INC" -O2 -std=c++17 -fno-exceptions -fno-rtti -D__PS4__ -Wno-unused -c src/main.cpp -o out/main.o
          "$LD" out/main.o -m elf_x86_64 -pie --script "$LM" --eh-frame-hdr -L"$LIBD" -Wl,--gc-sections -Wl,-z,max-page-size=16384 -lSceLibKernel_stub -lScePad_stub -lSceSysUtil_stub -lSceUserService_stub -lSceVideoOut_stub -lc -lkernel -lm -o 27menu.elf
          "$CF" --lib -in=27menu.elf -out=27menu.sprx
          ls -la 27menu.sprx

      - uses: actions/upload-artifact@v4
        with:
          name: 27menu-sprx
          path: "27menu.sprx"
          if-no-files-found: error
