name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld
          curl -fL --retry 3 -o tc.tar.gz https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
          mkdir -p "$HOME/tc"
          tar xzf tc.tar.gz -C "$HOME/tc"
          CF=$(find "$HOME/tc" -name 'create-fself' | head -1)
          test -n "$CF"
          chmod +x "$CF"
          TC=$(dirname "$(dirname "$(dirname "$CF")")")
          echo "TC=$TC"
          ls "$TC/include/orbis"
          ls "$TC/lib"
          test -f "$TC/link.x"
          test -d "$TC/include"
          test -d "$TC/lib"
          CC=$(command -v clang++)
          LD=$(command -v ld.lld)
          echo "CC=$CC"
          echo "LD=$LD"
          {
            echo "TC=$TC"
            echo "CF=$CF"
            echo "CC=$CC"
            echo "LD=$LD"
          } >> $GITHUB_ENV

      - name: Build
        run: |
          set -e
          mkdir -p out
          "$CC" -target x86_64-pc-freebsd12-elf -fPIC -funwind-tables -isysroot "$TC" -isystem "$TC/include" -O2 -std=c++17 -fno-exceptions -fno-rtti -D__PS4__ -Wno-unused -c src/main.cpp -o out/main.o
          "$LD" out/main.o -m elf_x86_64 -pie --script "$TC/link.x" --eh-frame-hdr -L"$TC/lib" -Wl,--gc-sections -Wl,-z,max-page-size=16384 -lSceLibKernel_stub -lc -lkernel -lm -o 27menu.elf
          "$CF" --lib -in=27menu.elf -out=27menu.sprx
          ls -la 27menu.sprx

      - uses: actions/upload-artifact@v4
        with:
          name: 27menu-sprx
          path: "27menu.sprx"
          if-no-files-found: error
